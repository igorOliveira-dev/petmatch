<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetMatch - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cabecalho"></div>

  <!-- Formulário de login -->
  <main class="login"><form id="form-login">
    <h2>LOGIN</h2>
    <label>E-MAIL</label>
    <input type="email" id="email" placeholder="Digite o E-Mail" autocomplete="username" required>
    <label>SENHA</label>
    <input type="password" id="senha" placeholder="Digite a senha" autocomplete="current-password" required>
    <a class="link" href="#" id="esqueci">ESQUECI MINHA SENHA</a>
    <p class="erro" id="erro"></p>
    <button class="btn" id="entrar" type="submit">ENTRAR</button>
    <a class="btn" href="registro.html">CADASTRAR-SE</a>
  </form></main>

  <script src="app.js"></script>
  <script>
    montarCabecalho('nenhum');

    // Botão ENTRAR: procura um usuário com o e-mail e senha digitados
    if (usuarioLogado()) location.href = 'home.html';   // já está logado
    document.getElementById('form-login').onsubmit = async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const botao = document.getElementById('entrar');
      if (!email || !senha) return document.getElementById('erro').textContent = 'Informe e-mail e senha.';
      botao.disabled = true;
      try {
        entrar(await api('POST', '/login', { email, senha }));   // guarda quem entrou e vai pra home
      } catch (err) {
        document.getElementById('erro').textContent = err.message;
        botao.disabled = false;
      }
    };

    // Link "esqueci minha senha" (só um aviso; um site real enviaria e-mail)
    document.getElementById('esqueci').onclick = e => {
      e.preventDefault();
      alert('Em um site real, enviaríamos um e-mail de recuperação.');
    };
  </script>
</body>
</html>
