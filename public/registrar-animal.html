<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetMatch - Registrar animal</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cabecalho"></div>
  <main>
    <div class="codigo" id="codigo"></div>
    <div class="animal">

      <!-- Foto: clicar abre o seletor de arquivo -->
      <label class="foto" id="foto">
        <span id="txt-foto">➕<br>ADICIONE A FOTO<br>DO ANIMAL</span>
        <input type="file" id="arquivo" accept="image/*" hidden>
        <input type="text" id="nome" placeholder="Digite o nome do animal" onclick="event.stopPropagation()">
      </label>

      <!-- Características do animal -->
      <div class="info">
        <div><span class="icone">👶</span>Idade (anos):<input type="number" id="idade" min="0" step="1"></div>
        <div><span class="icone">⚖️</span>Peso (kg):<input type="number" id="peso" min="0" step="0.1"></div>
        <div><span class="icone">🐾</span>Temperamento:<input id="temperamento"></div>
        <div><span class="icone">⚧</span>Sexo:<select id="sexo"><option>Macho</option><option>Fêmea</option></select></div>
        <div><span class="icone">💉</span>Vacinação:<select id="vacinacao"><option>Vacinado</option><option>Não vacinado</option></select></div>
        <div><span class="icone">✂️</span>Situação:<select id="situacao"><option>Castrado</option><option>Não castrado</option></select></div>
        <div><span class="icone">🧬</span>Espécie:<select id="especie"><option>Cachorro</option><option>Gato</option></select></div>
        <div><span class="icone">📍</span>Cidade:<input id="cidade"></div>
        <div><span class="icone">👤</span>Tutor:<input id="tutor"></div>
      </div>
    </div>
    <p class="erro centro" id="erro"></p>
    <p class="centro"><button class="btn" id="salvar">SALVAR REGISTRO</button></p>
  </main>

  <script src="app.js"></script>
  <script>
    exigirLogin();
    montarCabecalho('logado');
    const $ = id => document.getElementById(id);

    // O código do pet (#0007) é gerado pelo banco quando salvar
    $('codigo').textContent = 'NOVO PET';
    $('tutor').value = usuarioLogado().nome;   // já preenche o tutor com quem está logado

    // Foto: lê o arquivo, reduz para 500px (para o envio ficar leve) e mostra
    let foto = '';
    $('arquivo').onchange = e => {
      const leitor = new FileReader();
      leitor.onload = () => {
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, 500 / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * escala; canvas.height = img.height * escala;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          foto = canvas.toDataURL('image/jpeg', 0.7);
          $('foto').style.backgroundImage = `url('${foto}')`;
          $('txt-foto').style.display = 'none';
        };
        img.src = leitor.result;
      };
      if (e.target.files[0]) leitor.readAsDataURL(e.target.files[0]);
    };

    // SALVAR REGISTRO: valida e guarda o pet
    $('salvar').onclick = async () => {
      const campos = ['nome', 'idade', 'peso', 'temperamento', 'cidade', 'tutor'];
      if (campos.some(c => !$(c).value.trim())) { $('erro').textContent = 'Preencha todos os campos.'; return; }
      const pet = {
        foto,
        nome: $('nome').value.trim(), idade: Number($('idade').value), peso: Number($('peso').value),
        temperamento: $('temperamento').value.trim(), sexo: $('sexo').value, vacinacao: $('vacinacao').value,
        situacao: $('situacao').value, especie: $('especie').value, cidade: $('cidade').value.trim(), tutor: $('tutor').value.trim()
      };
      try {
        await api('POST', '/pets', pet);
        location.href = 'meus-pets.html';
      } catch (e) { $('erro').textContent = e.message; }
    };
  </script>
</body>
</html>
