<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetMatch - Login</title>
  <link href="" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cabecalho"></div>

  <!-- Formulário de login -->
  <main class="login">
    <h2>LOGIN</h2>
    <label>E-MAIL</label>
    <input type="email" id="email" placeholder="Digite o E-Mail">
    <label>SENHA</label>
    <input type="password" id="senha" placeholder="Digite a senha">
    <a class="link" href="#" id="esqueci">ESQUECI MINHA SENHA</a>
    <p class="erro" id="erro"></p>
    <button class="btn" id="entrar">ENTRAR</button>
    <a class="btn" href="registro.html">CADASTRAR-SE</a>
  </main>

  <script src="app.js"></script>
  <script>
    montarCabecalho('nenhum');

    // Botão ENTRAR: procura um usuário com o e-mail e senha digitados
    document.getElementById('entrar').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const usuario = ler('usuarios', []).find(u => u.email === email && u.senha === senha);
      if (!usuario) {
        document.getElementById('erro').textContent = 'E-mail ou senha incorretos.';
        return;
      }
      salvar('sessao', usuario);      // guarda quem entrou
      location.href = 'home.html';
    };

    // Link "esqueci minha senha" (só um aviso; um site real enviaria e-mail)
    document.getElementById('esqueci').onclick = e => {
      e.preventDefault();
      alert('Em um site real, enviaríamos um e-mail de recuperação.');
    };
  </script>
</body>
</html>
